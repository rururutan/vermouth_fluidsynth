name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Win32
            triplet: x86-windows
            suffix: x86
            build_dir: build-x86
          - arch: x64
            triplet: x64-windows
            suffix: x64
            build_dir: build-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install fluidsynth:${{ matrix.triplet }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B ${{ matrix.build_dir }} -A ${{ matrix.arch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build ${{ matrix.build_dir }} --config Release

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $packageDir = "package-${{ matrix.suffix }}"
          $zipName = "vermouth_fluidsynth-$version-${{ matrix.suffix }}.zip"
          $vcpkgBin = "$env:VCPKG_ROOT\installed\${{ matrix.triplet }}\bin"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "${{ matrix.build_dir }}\bin\Release\vermouth.dll" $packageDir
          Copy-Item README.md $packageDir
          Copy-Item LICENSE $packageDir

          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" $packageDir -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipName -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vermouth_fluidsynth-${{ matrix.suffix }}
          path: vermouth_fluidsynth-${{ github.ref_name }}-${{ matrix.suffix }}.zip

  release:
    name: Publish Release
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/vermouth_fluidsynth-x86/*.zip
            artifacts/vermouth_fluidsynth-x64/*.zip
